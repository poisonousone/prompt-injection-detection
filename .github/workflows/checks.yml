name: Lightweight checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.19"
      - run: uv sync --locked --group agentdojo
      - run: uv run --group agentdojo ruff check .
      - run: uv run --group agentdojo ruff format --check .
      - run: uv run --group agentdojo pyright
      - run: uv run --group agentdojo pytest
      - name: Build lightweight service image
        run: docker build --build-arg INCLUDE_MODEL=false --tag promptshield:ci .
